# perf.yml — generated by driftwatch (edit only if you want to)
#
# Regenerate by deleting this file and running `driftwatch init`.
# Driftwatch never overwrites an existing perf.yml.

detect: unknown

# Metrics driftwatch will collect. Only metrics it can actually collect are listed —
# it will not promise a number it cannot produce.
measure: []                # nothing measurable was detected

# The delta at which a change is called a regression.
# Separately and not configurable: anything under 2% is treated as measurement
# noise and reported as "no change".
threshold: 5%

# Boot the built app and measure route latency (Layer 2a). --no-serve skips per run.
serve: true

# Lighthouse browser metrics against the served app (needs Chrome). --no-browser skips per run.
browser: true

# Measure the AI's suggested diff fix in a fresh copy before showing it (M6). --no-verify skips.
verify: true

# "propose": when a verified fix RESTORES the regressed metrics, open a fix PR into your PR
# branch carrying the measured evidence. Off by default — turn it on once you trust the numbers.
auto_fix: off

# Warn only. Set to true once you trust the numbers and want failing checks to block merges.
block_merge: false

# Default git ref to compare against. Override per run with --base.
base: main

# AI analysis — the optional tier. Measurement never needs a key; explaining a regression does.
# Nothing is sent anywhere without one.
provider: deepseek
model: deepseek-chat

# Where the key comes from, in order:
#   1. DRIFTWATCH_API_KEY in the environment (your shell, or CI secrets)
#   2. key_command below — its stdout is used and never stored
#   3. ${PROVIDER}_API_KEY you already have set (DEEPSEEK_API_KEY, OPENAI_API_KEY, …)
#
# NEVER put the key itself in this file — it is committed, and driftwatch refuses to run if it
# finds one here. A command is fine:
# key_command: op read op://vault/ai/key

# Hard ceiling on what ONE analysed regression may cost. Unset by default. When the projected
# cost exceeds it, driftwatch refuses the analysis rather than truncating it or switching models
# — the measurement and verdict are unaffected. Per-run only: driftwatch does not know your
# provider bill and does not track a running total.
# max_cost_per_run: 0.05
